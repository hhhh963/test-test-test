 if(t.code&&S.bank.some(x=>x.code==t.code&&x.id!=t.id))return fail('Задание с кодом '+t.code+' уже есть в банке.');
 if(C.eid)S.bank=S.bank.map(x=>x.id==t.id?t:x);else S.bank.push(t);if(C.orig&&C.orig!=t.img)idel(C.orig);save();go('bank',{f})},
imp:()=>{try{const arr=JSON.parse($('#bk').value);if(!Array.isArray(arr))throw 0;arr.forEach(t=>{if(t&&t.text&&t.n&&!S.bank.some(x=>x.id==t.id))S.bank.push(Object.assign({},t,{id:uid(),img:'',subj:SUBJ}))});save();go('bank',{msg:'Импорт выполнен.'})}catch(e){C.msg='Не удалось прочитать данные. Вставьте текст резервной копии целиком.';render()}},
demo:()=>{for(let n=1;n<=N;n++)S.bank.push({id:uid(),n,subj:SUBJ,topic:T[n-1],text:'Демо-задание №'+n+'. Найдите $x$, если $x+'+n+'='+2*n+'$.',answer:String(n),solution:'Критерии: обоснованное решение — полный балл.',code:''});save();go('bank')},
mk:()=>{const mode='auto',seed=+$('#bs').value||1,r=rng(seed);let ids=[],miss=[];
 if(mode=='manual')ids=[...document.querySelectorAll('.mk:checked')].map(x=>x.value);
 else document.querySelectorAll('#aut [data-n]').forEach(i=>{const n=+i.dataset.n,c=+i.value||0;if(!c)return;const p=S.bank.filter(t=>t.n==n&&(t.subj||'math')==SUBJ).map(t=>[r(),t.id]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);if(!p.length)miss.push(n);ids.push(...p.slice(0,c))});
 if(!ids.length)return go('build',{msg:'Нет задач для варианта. Добавьте задания в банк или отметьте задачи вручную.'});
 ids.sort((a,b)=>S.bank.find(t=>t.id==a).n-S.bank.find(t=>t.id==b).n);
 S.vars.push({id:uid(),name:$('#bn').value.trim()||'Вариант '+(S.vars.length+1),mode:'exam',limit:+$('#bl').value,seed,ids,own:TUT?null:ME,subj:SUBJ});save();A.start(S.vars[S.vars.length-1].id);return;
 go('home')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
 if(f=='ans'){att().answers[t.dataset.t]=t.value;save();const c=document.querySelector('.chip.on');if(c)c.classList.toggle('dn',!!norm(t.value))}
 else if(f=='self'){att().self[t.dataset.t]=Math.max(0,Math.min(+t.dataset.m,+t.value||0));save();$('#tot').textContent=score(att()).total;$('#tst').textContent=tstA(att())}
 else if(t.id=='g-r'){goalSet(+t.value);gUpd(+t.value)}else if(t.id&&t.id.indexOf('ba-')==0){const id=t.id.slice(3),b=document.querySelector('[data-a="bchk"][data-v="'+id+'"]');BV[id]=t.value;if(b)b.disabled=!t.value.trim()}else if(t.id=='fx'){$('#pv').innerHTML=fmt(t.value);typeset()}else if(t.id=='fq')fillList()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='fimg'){pick(t.files[0]);t.value=''}else if(t.id=='fn'){$('#ft').value=T[t.value-1];$('#la').hidden=+t.value>CFG.part1Last}
 else if(t.id=='flt')fillList();else if(t.name=='mode'){$('#man').hidden=t.value!='manual';$('#aut').hidden=t.value=='manual'}});
render();

window.dtb=()=>`<div class="dtb noprint"><button data-t="pen" title="Ручка" aria-label="Ручка">${svg('pen')}</button><button data-t="er" title="Ластик: стирает линию целиком" aria-label="Ластик">${svg('er')}</button><span class="sw dx"><i data-c="b" title="Чёрный"></i><i data-c="u" title="Синий"></i><i data-c="r" title="Красный"></i></span><button class="dx" data-t="clr" title="Очистить всё" aria-label="Очистить всё">${svg('tr')}</button><button class="dx" data-t="cur" title="Выйти из рисования" aria-label="Выйти из рисования">${svg('x')}</button></div>`;
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType=='touch'){tp.set(e.pointerId,[e.clientX,e.clientY]);if(tp.size>1){if(cur&&cur.pts&&cur.pts.length<8){strokes.pop();redraw()}cur=null;lm=mid();return}}
 e.preventDefault();const p=pg(e);
 if(tool=='er'){cur={er:1};erase(p);return}
 cur={c:col,pts:[p]};strokes.push(cur);seg(col,p,[p[0]+.1,p[1]])});
cv.addEventListener('pointermove',e=>{
 if(e.pointerType=='touch'&&tp.has(e.pointerId)){tp.set(e.pointerId,[e.clientX,e.clientY]);if(tp.size>1){const m=mid();if(lm)scrollBy(lm[0]-m[0],lm[1]-m[1]);lm=m;return}}
 if(!cur)return;const p=pg(e);if(cur.er){erase(p);return}
 const q=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])<1.5)return;cur.pts.push(p);seg(cur.c,q,p)});
const up=e=>{tp.delete(e.pointerId);if(tp.size<2)lm=null;cur=null};
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,up));
document.addEventListener('click',e=>{const i=e.target.closest('.dtb [data-c]'),b=e.target.closest('.dtb [data-t]');if(i){col=i.dataset.c;tool='pen'}else if(b){const t=b.dataset.t;if(t=='clr'){strokes=[];redraw();return}tool=(t==tool&&t!='cur')?'cur':t}else return;apply();upd()});
addEventListener('resize',()=>{if(!cv.hidden)size()});
addEventListener('scroll',()=>{if(!cv.hidden&&!rq)rq=requestAnimationFrame(()=>{rq=0;redraw()})},{passive:true});
addEventListener('keydown',e=>{if(e.key=='Escape'&&tool!='cur'){tool='cur';apply();upd()}});

window.dfb=()=>{const ok=okV();cv.hidden=!ok;if(ok){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;if(cv.width!=Math.round(r.width*d)||cv.height!=Math.round(r.height*d))size();else redraw()}else{strokes=[];tool='cur';apply()}upd()};

const lerr=m=>{const e=$('#lmsg');if(e)e.textContent=m},
EM=/^\S+@\S+\.\S+$/,
ae=e=>{const m=((e&&e.message)||'').toLowerCase(),c=(e&&e.code)||'';
 if(c=='user_already_exists'||m.includes('already registered'))return'Этот аккаунт уже зарегистрирован. Войдите или используйте другую почту.';
 if(c=='invalid_credentials'||m.includes('invalid login'))return'Неверная почта или пароль.';
 if(c=='weak_password'||m.includes('at least'))return'Пароль слишком короткий: нужно не менее 6 символов.';
 if(c=='email_not_confirmed'||m.includes('not confirmed'))return'Подтвердите почту: перейдите по ссылке из письма.';
 if(m.includes('rate limit')||c.includes('rate_limit'))return'Слишком много попыток. Подождите немного и попробуйте снова.';
 if(m.includes('invalid')&&m.includes('email')||c=='email_address_invalid')return'Введите корректную почту.';
 if(m.includes('anonymous'))return'Заполните все поля.';
 if(m.includes('failed to fetch')||m.includes('network'))return'Нет соединения с интернетом.';
 return'Не удалось выполнить действие. Попробуйте ещё раз.'};

login:async()=>{const m=$('#lm').value.trim(),p=$('#lp').value;if(!m)return lerr('Введите почту.');if(!p)return lerr('Введите пароль.');lerr('');const done=busy('login','Входим…');
 try{const r=await sb.auth.signInWithPassword({email:m,password:p});if(r.error){done();return lerr(ae(r.error))}await boot()}catch(e){done();lerr('Не удалось войти. Проверьте соединение и попробуйте снова.')}},
reg:async()=>{const n=$('#ln').value.trim(),m=$('#lm').value.trim(),p=$('#lp').value;
 if(!n)return lerr('Введите имя.');if(!m)return lerr('Введите почту.');if(!EM.test(m))return lerr('Введите корректную почту.');if(!p)return lerr('Введите пароль.');if(p.length<6)return lerr('Пароль должен содержать не менее 6 символов.');lerr('');const done=busy('reg','Регистрируем…');

  if(r.data.user&&r.data.user.identities&&r.data.user.identities.length==0){done();return lerr('Этот аккаунт уже зарегистрирован. Войдите или используйте другую почту.')}
  if(r.data.session){await boot()}else{C.msg='Проверьте почту, подтвердите регистрацию и войдите.';C.reg=0;render()}}
 catch(e){done();lerr('Не удалось зарегистрироваться. Проверьте соединение и попробуйте снова.')}},
out:()=>{if($('#md'))return;const d=document.createElement('div');d.id='md';d.className='noprint';d.innerHTML='<div class="mb" role="dialog" aria-modal="true"><p>Вы точно хотите выйти?</p><div class="row"><button class="btn" data-a="outyes">Да, выйти</button><button data-a="outno">Остаться</button></div></div>';d.onclick=e=>{if(e.target==d)d.remove()};document.body.append(d)},

 if(!TUT){try{const r=E(await sb.rpc('check_task',{p_task:t.id,p_answer:v}));t.answer=r.answer||'';t.solution=r.solution||'';C.res=part(t.n)==1?(r.correct?1:2):3}catch(e){C.msg='Не удалось проверить: '+(e.message||e);C.res=0}}

 b.disabled=true;b.textContent='Проверяем…';let res;
 try{if(TUT)res=p1?(norm(v)!==''&&norm(v)==norm(t.answer)?1:2):3;else{const r=E(await sb.rpc('check_task',{p_task:id,p_answer:v}));t.answer=r.answer||'';t.solution=r.solution||'';res=p1?(r.correct?1:2):3}}
 catch(e){o.innerHTML='<p class="bad">Не удалось проверить: '+esc(e.message||e)+'</p>';b.textContent=lab;b.disabled=p1&&!v.trim();return}
 b.textContent=lab;b.disabled=p1&&!v.trim();box.classList.remove('okc','badc');BS[id]=res;if(res==1)box.classList.add('okc');if(res==2)box.classList.add('badc');
 BR[id]=res==1?'<p class="good">Верно</p>':res==2?'<p class="bad">Неверно</p>':(t.solution?'<div class="pv">'+fmt(t.solution)+'</div>':'<p class="mut">Решение не добавлено.</p>');
 o.innerHTML=BR[id];typeset()},
